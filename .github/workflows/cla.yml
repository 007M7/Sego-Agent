name: CLA

# Enforces the contributor licence in CLA.md for outside pull requests.
#
# Setup this workflow needs before it can pass (see CONTRIBUTING.md):
#   1. A branch named `cla-signatures` must exist. It only holds
#      `signatures/version1/cla.json`; it is not built or merged.
#   2. A repository secret `CLA_PERSONAL_ACCESS_TOKEN` — a fine-grained token with
#      `contents: write` on this repository. The default `GITHUB_TOKEN` cannot
#      push to another branch from a `pull_request_target` run.
# Until both exist the job fails rather than silently skipping, which is the
# correct failure mode for a gate: an unenforced CLA must not look enforced.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    steps:
      - name: Check or record signature
        if: >-
          (github.event_name == 'issue_comment' &&
           (github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/007M7/Sego-Agent/blob/main/CLA.md'
          branch: 'cla-signatures'
          # The maintainer and bots do not sign their own contributions.
          allowlist: '007M7,bot*,dependabot[bot],github-actions[bot]'
          remote-organization-name: '007M7'
          remote-repository-name: 'Sego-Agent'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
          signed-commit-message: 'chore: record CLA signature for $contributorName'
