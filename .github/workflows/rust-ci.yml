name: Rust CI

# Path filters are deliberately broad. An earlier filter matched only
# `.github/workflows/rust-ci.yml` and `rust/**`, so a change to `schema/`,
# the installers or the release workflow itself merged without running any
# gate. Anything that can change what the binary does, what it promises in a
# published contract, or how it is installed belongs in this list.
on:
  push:
    branches:
      - main
      - 'gaebal/**'
      - 'omx-issue-*'
    paths:
      - .github/workflows/**
      - rust/**
      - schema/**
      - skills/**
      - packaging/**
      - install.ps1
      - install.sh
      - start-sego-windows.cmd
      - AGENTS.md
      - CONTRIBUTING.md
      - CHANGELOG.md
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - rust/**
      - schema/**
      - skills/**
      - packaging/**
      - install.ps1
      - install.sh
      - start-sego-windows.cmd
      - AGENTS.md
      - CONTRIBUTING.md
      - CHANGELOG.md
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always
  # The toolchain is pinned rather than floating on `stable`: a release is
  # built by whatever `stable` resolves to that day. Bump this deliberately.
  RUST_TOOLCHAIN: '1.98.0'

permissions:
  contents: read

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: cargo clippy (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
      - name: Lint workspace
        # Advisory until the pre-existing pedantic-warning baseline is cleared;
        # see AGENTS.md. Do not add new warnings.
        run: cargo clippy --workspace --all-targets
    continue-on-error: true

  test-workspace:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Run all tests
        run: cargo test --workspace

  test-platforms:
    name: cargo test (${{ matrix.os }})
    # Sego ships Windows, Linux and macOS binaries, and parts of the code are
    # platform-specific (sandboxing, PowerShell, path handling). A single
    # Ubuntu runner cannot see a Windows-only regression.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
      - name: Run all tests
        run: cargo test --workspace

  dependency-audit:
    name: cargo deny (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-deny
      - name: Audit dependencies
        run: cargo deny check
    # Advisory on purpose, and labelled as such rather than left to inference:
    # this is the repository's first dependency audit, so nobody has seen what it
    # reports, and a blocking job that starts red would just be disabled. The
    # policy itself is in rust/deny.toml - which cannot be hollowed out or
    # deleted, because runtime/tests/dependency_policy.rs asserts its shape.
    #
    # The offline half of DEV-SEC-14 already blocks: crates.io-only sources, no
    # git dependencies and the policy file's presence ride
    # `cargo test --workspace` above. Drop this `continue-on-error` once the
    # first run's findings are fixed or waived with a reason in `deny.toml`.
    continue-on-error: true

  contracts:
    name: published contract metadata
    runs-on: ubuntu-latest
    # Runs from the repository root, not `rust/`.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate JSON Schemas and their contract metadata
        # The schemas are the published contract. A schema that stops parsing,
        # or loses its contract id/revision, breaks every consumer silently.
        run: |
          python - <<'PY'
          import json, pathlib, sys

          required = ("x-contract-id", "x-contract-revision", "x-contract-ratified")
          schema_dir = pathlib.Path("schema")
          schemas = sorted(schema_dir.glob("*.schema.json"))
          if not schemas:
              sys.exit("no schemas found under schema/")
          for path in schemas:
              document = json.loads(path.read_text(encoding="utf-8"))
              missing = [key for key in required if key not in document]
              if missing:
                  sys.exit(f"{path}: missing contract metadata {missing}")
              if not isinstance(document.get("x-contract-revision"), int):
                  sys.exit(f"{path}: x-contract-revision must be an integer")
              print(f"{path}: {document['x-contract-id']} rev {document['x-contract-revision']}")
          PY
