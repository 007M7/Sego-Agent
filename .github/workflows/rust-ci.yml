name: Rust CI

# Path filters are deliberately broad. An earlier filter matched only
# `.github/workflows/rust-ci.yml` and `rust/**`, so a change to `schema/`,
# the installers or the release workflow itself merged without running any
# gate. Anything that can change what the binary does, what it promises in a
# published contract, or how it is installed belongs in this list.
on:
  push:
    branches:
      - main
      - 'gaebal/**'
      - 'omx-issue-*'
    # No `paths` filter, deliberately.
    #
    # A required status check is matched by name, and a workflow that does not
    # run reports nothing at all: with a path filter, a pull request outside
    # those paths waits forever on a check that will never arrive, and cannot
    # merge. Documentation-only changes are common here.
    #
    # `DEV-QA-06` widened this list once for the same underlying reason - a
    # change that does not run its gate is not gated. No list stays complete,
    # and this repository is public, so the minutes are free.
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always
  # The toolchain is pinned rather than floating on `stable`: a release is
  # built by whatever `stable` resolves to that day. Bump this deliberately.
  RUST_TOOLCHAIN: '1.98.0'

permissions:
  contents: read

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
      - name: Lint workspace
        # A gate, like fmt and the tests. The workspace enables `clippy::all`
        # and `clippy::pedantic` in `[workspace.lints]`, so this covers both.
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-workspace:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    env:
      # The Python-dependent tests must fail here rather than skip: this job
      # provisions an interpreter on purpose, so a skip would mean the coverage
      # recorded for this platform had silently gone away again (DEV-QA-07).
      SEGO_REQUIRE_PYTHON: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Run all tests
        run: cargo test --workspace

  test-platforms:
    name: cargo test (${{ matrix.os }})
    # Sego ships Windows, Linux and macOS binaries, and parts of the code are
    # platform-specific (sandboxing, PowerShell, path handling). A single
    # Ubuntu runner cannot see a Windows-only regression.
    runs-on: ${{ matrix.os }}
    env:
      # The Python-dependent tests must fail here rather than skip: this job
      # provisions an interpreter on purpose, so a skip would mean the coverage
      # recorded for this platform had silently gone away again (DEV-QA-07).
      SEGO_REQUIRE_PYTHON: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Run all tests
        run: cargo test --workspace

  dependency-audit:
    name: cargo deny (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-deny
      - name: Audit dependencies
        run: cargo deny check
    # Blocking now, which is what the previous comment said to do once the first
    # run's findings were dealt with. They are: two quick-xml vulnerabilities
    # and a rustls TLS advisory are fixed by dependency bumps, and the two
    # remaining entries are unmaintained-not-vulnerable crates that arrive
    # through syntect, each waived with a written reason in `rust/deny.toml`.
    # `advisories ok, bans ok, licenses ok, sources ok` as of that change.
    #
    # This job depends on the remote advisory database, so a newly published
    # advisory can turn it red without anything in the repository changing. That
    # is intended rather than a flake: the response is to fix the dependency or
    # write a waiver with a reason, and the policy file cannot be hollowed out
    # or deleted because runtime/tests/dependency_policy.rs asserts its shape -
    # including that every waiver carries a reason.
    #
    # The offline half of DEV-SEC-14 also blocks, on every `cargo test
    # --workspace`: crates.io-only sources, no git dependencies, and the policy
    # file's presence.

  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    env:
      # The Python-dependent tests must fail here rather than skip: this job
      # provisions an interpreter on purpose, so a skip would mean the coverage
      # recorded for this platform had silently gone away again (DEV-QA-07).
      SEGO_REQUIRE_PYTHON: '1'
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust -> target
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage and enforce the recorded floor
        # The floor and its justification live in rust/coverage-baseline.json.
        # runtime/tests/coverage_policy.rs asserts this job uses the number
        # recorded there, so the file and CI cannot drift apart.
        #
        # A ratchet against a real drop, not a quality target: line coverage
        # counts execution, not verification. Ubuntu only, because coverage
        # numbers are not comparable across platforms - code behind
        # #[cfg(windows)] or #[cfg(unix)] only compiles where it applies.
        run: cargo llvm-cov --workspace --fail-under-lines 75

  contracts:
    name: published contract metadata
    runs-on: ubuntu-latest
    # Runs from the repository root, not `rust/`.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate JSON Schemas and their contract metadata
        # The schemas are the published contract. A schema that stops parsing,
        # or loses its contract id/revision, breaks every consumer silently.
        run: |
          python - <<'PY'
          import json, pathlib, sys

          required = ("x-contract-id", "x-contract-revision", "x-contract-ratified")
          schema_dir = pathlib.Path("schema")
          schemas = sorted(schema_dir.glob("*.schema.json"))
          if not schemas:
              sys.exit("no schemas found under schema/")
          for path in schemas:
              document = json.loads(path.read_text(encoding="utf-8"))
              missing = [key for key in required if key not in document]
              if missing:
                  sys.exit(f"{path}: missing contract metadata {missing}")
              if not isinstance(document.get("x-contract-revision"), int):
                  sys.exit(f"{path}: x-contract-revision must be an integer")
              print(f"{path}: {document['x-contract-id']} rev {document['x-contract-revision']}")
          PY

  # The check branch protection requires.
  #
  # One stable name, so jobs can be added or removed without editing the branch
  # protection settings, and `skipped` counts as success so a job that
  # deliberately does not run cannot masquerade as a failure. If any job above
  # did not succeed, this fails - which is what a merge is then blocked on.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - fmt
      - clippy
      - test-workspace
      - test-platforms
      - dependency-audit
      - coverage
      - contracts
    runs-on: ubuntu-latest
    # The workflow defaults `run` to `rust/`, which does not exist here: this job
    # reads the `needs` context and checks nothing out.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$failed" ]; then
            echo "::error::jobs that did not succeed: $(echo $failed | tr '\n' ' ')"
            exit 1
          fi
          echo "all required jobs succeeded or were skipped"
