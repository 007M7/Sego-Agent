name: Release

# A tag push builds and publishes. Nothing else ran first, so a tag could ship
# a binary that does not pass the test suite. `verify` now gates every build
# job: the release cannot be created unless fmt and the workspace test suite
# pass on the tagged commit.
on:
  push:
    tags:
      - 'v*'

env:
  # Pinned so a release is not built by whatever `stable` resolves to that day.
  RUST_TOOLCHAIN: '1.98.0'

permissions:
  contents: read

jobs:
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: rust
      - name: Run all tests
        run: cargo test --workspace
        working-directory: rust

  build-windows:
    name: Build Windows binary
    needs: [verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Build release
        run: cargo build --release
        working-directory: rust
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: sego-windows
          path: rust/target/release/sego.exe
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/sego-windows | Out-Null
          Copy-Item rust/target/release/sego.exe dist/sego-windows/sego.exe
          Copy-Item packaging/windows/Sego.cmd dist/sego-windows/Sego.cmd
          Copy-Item packaging/windows/README-WINDOWS.txt dist/sego-windows/README-WINDOWS.txt
          Compress-Archive -Path dist/sego-windows/* -DestinationPath dist/sego-windows.zip -Force
      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v5
        with:
          name: sego-windows-zip
          path: dist/sego-windows.zip

  build-linux:
    name: Build Linux binary
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Build release
        run: cargo build --release
        working-directory: rust
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: sego-linux
          path: rust/target/release/sego

  build-macos:
    name: Build macOS binary
    needs: [verify]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Build release
        run: cargo build --release
        working-directory: rust
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: sego-macos
          path: rust/target/release/sego

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    # Only this job needs to write.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: sego-windows
          path: artifacts/windows
      - uses: actions/download-artifact@v5
        with:
          name: sego-windows-zip
          path: artifacts/windows-zip
      - uses: actions/download-artifact@v5
        with:
          name: sego-linux
          path: artifacts/linux
      - uses: actions/download-artifact@v5
        with:
          name: sego-macos
          path: artifacts/macos
      - name: Normalize release asset names
        run: |
          cp artifacts/windows/sego.exe artifacts/sego.exe
          cp artifacts/windows-zip/sego-windows.zip artifacts/sego-windows.zip
          cp artifacts/linux/sego artifacts/sego
          cp artifacts/macos/sego artifacts/sego-macos
      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum sego.exe sego-windows.zip sego sego-macos > checksums.txt
          cat checksums.txt
      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          for asset in artifacts/sego.exe artifacts/sego-windows.zip artifacts/sego artifacts/sego-macos artifacts/checksums.txt; do
            if [ ! -s "$asset" ]; then
              echo "::error file=$asset::Release asset is missing or empty"
              exit 1
            fi
          done
          ls -lh artifacts/sego.exe artifacts/sego-windows.zip artifacts/sego artifacts/sego-macos artifacts/checksums.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/sego.exe
            artifacts/sego-windows.zip
            artifacts/sego
            artifacts/sego-macos
            artifacts/checksums.txt
          name: Sego Agent ${{ github.ref_name }}
          # The body is version-agnostic on purpose. It previously hardcoded the
          # v0.1.9 release notes while the heading used the tag, so the next
          # release would have announced v0.1.9's features under a new version.
          # Point at the changelog instead of restating features here.
          body: |
            ## Sego Agent ${{ github.ref_name }}

            What changed in this release: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

            ### Download
            - **Windows:** `sego-windows.zip` for double-click use, or `sego.exe` for terminal use
            - **Linux:** `sego`
            - **macOS:** `sego-macos`
            - **Checksums:** `checksums.txt` contains SHA-256 hashes for all release binaries

            ### Verify the download
            Compare the hash of the file you downloaded against `checksums.txt` before running it:

            ```bash
            # macOS / Linux
            sha256sum sego-macos        # or: shasum -a 256 sego-macos
            ```

            ```powershell
            # Windows
            Get-FileHash .\sego.exe -Algorithm SHA256
            ```

            Verify before use: an unsigned binary that has not been checked is only as trustworthy as the channel it came from.

            ### Quick Start
            ```powershell
            # Windows installer: downloads the latest binary and creates a desktop shortcut
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```

            ```bash
            # macOS / Linux installer
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            ### Model configuration
            ```bash
            # DeepSeek recommended
            export DEEPSEEK_API_KEY=sk-your-key
            export DEEPSEEK_MODEL=deepseek-v4-flash

            # Or Anthropic
            export ANTHROPIC_API_KEY=sk-your-key
            ```

            ### Build from source
            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd Sego-Agent/rust && cargo build --release
            ```

            ### Trust boundary
            Reviewer metadata is not a cryptographic signature or remote attestation. Review Cards, AcceptanceRecords, and ReviewArtifacts are review evidence, not release approval, security certification, or a Founder verdict. Model-driven review is not exhaustive static analysis, so high-risk releases still require tests, CI, and human judgment.
          draft: false
          prerelease: false
