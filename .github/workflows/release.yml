name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Build release
        run: cargo build --release
        working-directory: rust
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: sego-windows
          path: rust/target/release/sego.exe
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/sego-windows | Out-Null
          Copy-Item rust/target/release/sego.exe dist/sego-windows/sego.exe
          Copy-Item packaging/windows/Sego.cmd dist/sego-windows/Sego.cmd
          Copy-Item packaging/windows/README-WINDOWS.txt dist/sego-windows/README-WINDOWS.txt
          Compress-Archive -Path dist/sego-windows/* -DestinationPath dist/sego-windows.zip -Force
      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v5
        with:
          name: sego-windows-zip
          path: dist/sego-windows.zip

  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Build release
        run: cargo build --release
        working-directory: rust
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: sego-linux
          path: rust/target/release/sego

  build-macos:
    name: Build macOS binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Build release
        run: cargo build --release
        working-directory: rust
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: sego-macos
          path: rust/target/release/sego

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: sego-windows
          path: artifacts/windows
      - uses: actions/download-artifact@v5
        with:
          name: sego-windows-zip
          path: artifacts/windows-zip
      - uses: actions/download-artifact@v5
        with:
          name: sego-linux
          path: artifacts/linux
      - uses: actions/download-artifact@v5
        with:
          name: sego-macos
          path: artifacts/macos
      - name: Normalize release asset names
        run: |
          cp artifacts/windows/sego.exe artifacts/sego.exe
          cp artifacts/windows-zip/sego-windows.zip artifacts/sego-windows.zip
          cp artifacts/linux/sego artifacts/sego
          cp artifacts/macos/sego artifacts/sego-macos
      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum sego.exe sego-windows.zip sego sego-macos > checksums.txt
          cat checksums.txt
      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          for asset in artifacts/sego.exe artifacts/sego-windows.zip artifacts/sego artifacts/sego-macos artifacts/checksums.txt; do
            if [ ! -s "$asset" ]; then
              echo "::error file=$asset::Release asset is missing or empty"
              exit 1
            fi
          done
          ls -lh artifacts/sego.exe artifacts/sego-windows.zip artifacts/sego artifacts/sego-macos artifacts/checksums.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/sego.exe
            artifacts/sego-windows.zip
            artifacts/sego
            artifacts/sego-macos
            artifacts/checksums.txt
          name: Sego Agent ${{ github.ref_name }}
          body: |
            ## Sego Agent ${{ github.ref_name }}

            ### 中文

            Sego v0.1.9 将本地代码审查进一步收敛为可被人和 Agent 共同消费的受治理审查证明。

            新增稳定的 `sego review show latest --json` / `/review show latest --json` 接口、Agent handoff 文档与集成模板，使调用方能够读取最新审查证明，而不必解析面向人的终端文本。ReviewArtifact 现在携带 `reviewer`、`engine_version`、`review_mode` 等本地身份元数据，并扩展了 parse/evidence 状态 schema。

            本版本还加入离线 Review Card、任务级 AcceptanceRecord、全范围审查 preflight、安全路径范围、evidence coverage、finding disposition、provider cache 可观测性和工作流事件恢复改进。默认权限由完全访问收紧为 `ReadOnly`，需要写权限时必须显式授予。

            Windows 插件生命周期与 hook 路径现在使用显式、同步的平台执行器，不再依赖文件关联；不支持的脚本、缺失解释器和非零退出都会按失败关闭。

            边界保持不变：reviewer 元数据不是密码学签名或远程证明；Review Card、AcceptanceRecord 和 ReviewArtifact 是审查证据，不是发布批准、安全认证或 Founder verdict。模型驱动审查也不是穷尽式静态分析，高风险发布仍需要测试、CI 与人工裁决。

            ### English

            Sego v0.1.9 advances local code review into a governed proof surface that can be consumed by both humans and coding agents.

            The new stable `sego review show latest --json` and `/review show latest --json` interfaces, agent handoff guidance, and integration templates let callers consume the latest review proof without scraping human-oriented terminal output. ReviewArtifact now carries local `reviewer`, `engine_version`, and `review_mode` metadata, together with expanded parse and evidence status schemas.

            This release also adds offline Review Cards, task-level AcceptanceRecord aggregation, full-scope review preflight, safe path scoping, evidence coverage, finding disposition, provider-cache observability, and workflow-event recovery improvements. The default permission is tightened from full access to `ReadOnly`; write authority must be granted explicitly.

            Windows plugin lifecycle and hook paths now use explicit synchronous platform runners instead of file associations; unsupported scripts, missing interpreters, and non-zero exits fail closed.

            The trust boundary remains explicit: reviewer metadata is not a cryptographic signature or remote attestation. Review Cards, AcceptanceRecords, and ReviewArtifacts are review evidence, not release approval, security certification, or a Founder verdict. Model-driven review is not exhaustive static analysis, so high-risk releases still require tests, CI, and human judgment.

            ### Download
            - **Windows:** `sego-windows.zip` for double-click use, or `sego.exe` for terminal use
            - **Linux:** `sego`
            - **macOS:** `sego-macos`
            - **Checksums:** `checksums.txt` contains SHA-256 hashes for all release binaries

            ### Quick Start
            ```powershell
            # Windows installer: downloads the latest binary and creates a desktop shortcut
            irm https://raw.githubusercontent.com/007M7/Sego-Agent/main/install.ps1 | iex
            ```

            ```bash
            # macOS / Linux installer
            curl -fsSL https://raw.githubusercontent.com/007M7/Sego-Agent/main/install.sh | bash
            ```

            ### Model configuration
            ```bash
            # DeepSeek recommended
            export DEEPSEEK_API_KEY=sk-your-key
            export DEEPSEEK_MODEL=deepseek-v4-flash

            # Or Anthropic
            export ANTHROPIC_API_KEY=sk-your-key
            ```

            ### Build from source
            ```bash
            git clone https://github.com/007M7/Sego-Agent.git
            cd Sego-Agent/rust && cargo build --release
            ```
          draft: false
          prerelease: false
