# cargo-deny policy for the Sego Rust workspace (DEV-SEC-14).
#
# Run: cargo deny --manifest-path rust/Cargo.toml check
#
# Before this file the repository had no dependency audit at all: advisories,
# licences and dependency sources were unreviewed. CI runs it in
# `dependency-audit`; read that job's comment for what blocks today and what
# still needs a first real run.
#
# Key choice: this deliberately uses only long-stable keys and leaves severity
# at cargo-deny's defaults (advisories are denied by default). Version-specific
# severity keys were avoided because the policy could not be validated offline,
# and a config that errors on load is worse than one that relies on defaults.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
# Waivers live here, one entry per line, each with an id and a reason.
ignore = [
    # Unmaintained, not vulnerable. Upstream ceased development permanently after
    # a harassment incident and considers 1.3.3 complete; there is no known
    # advisory against it. It also cannot be removed from here: bincode arrives
    # through syntect, which uses it for its precompiled syntax dumps, and that
    # dependency is not ours to change.
    #
    # Accepted on the same basis as any other waiver: a written decision, not a
    # default. Revisit if syntect drops it, or if an advisory is published
    # against 1.3.3 rather than merely calling the crate unmaintained.
    { id = "RUSTSEC-2025-0141", reason = "unmaintained, not vulnerable; transitive via syntect, not reachable from our code" },
    # Same shape, same source: the maintainer is unreachable and rustsec says
    # "No safe upgrade is available". yaml-rust arrives through syntect, which
    # parses its own bundled YAML syntax definitions with it - not data we or a
    # user supplies.
    #
    # Both entries point at one fact worth acting on: syntect 5.3.0 is the
    # latest release and is the sole source of every unmaintained advisory here.
    # Replacing it is a product decision (it draws the syntax highlighting),
    # not a dependency bump, and it is recorded as such rather than hidden by
    # the waiver.
    { id = "RUSTSEC-2024-0320", reason = "unmaintained, no safe upgrade; transitive via syntect over its own bundled syntax files" },
]

[licenses]
# Derived from the actual dependency set (Cargo.lock plus the `license` field of
# each vendored crate), not from a guess: MIT and Apache-2.0 account for most of
# the 220 registry dependencies, with Unicode-3.0, ISC, Unlicense, BSL-1.0,
# Zlib, 0BSD, BSD-2/3-Clause and CDLA-Permissive-2.0 covering the rest.
# Re-derive when dependencies change - cargo-deny names the offending licence.
#
# Copyleft licences are deliberately absent: `LGPL-2.1-or-later` appears only
# inside an `OR` expression that also offers MIT or Apache-2.0, so the permissive
# branch is available and no copyleft obligation attaches.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",
    "Unlicense",
    "BSL-1.0",
    "Zlib",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The rule above is about unbounded *registry* version selection: `version = "*"`
# accepts whatever the index offers, which is a supply-chain decision nobody
# made. It does not apply to path dependencies - `runtime = { path = "../runtime" }`
# resolves to a directory in this repository, so there is no registry, no
# version selection and no third party. Every workspace member is `publish = false`
# anyway, so a version requirement on an in-repo dependency would document
# nothing and add a bump-time chore across twenty declarations.
#
# So the exemption is scoped to exactly that case. A wildcard on a crates.io
# dependency is still denied.
allow-wildcard-paths = true

[sources]
# Every dependency must come from crates.io. A `git` or arbitrary-registry
# dependency is a supply-chain change that should be argued for explicitly, and
# `runtime/tests/dependency_policy.rs` enforces the same rule offline on every
# `cargo test --workspace`.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
